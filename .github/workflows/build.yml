
name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'nginx/**'
      - 'Dockerfile'

  workflow_dispatch:

permissions:
  contents: write
  packages: write
concurrency: deploy
env:
  IMAGE: ghcr.io/ajacobs06/portfolio
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for ARM64 and AMD64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy - point the cluster at new image
        run: |
          sed -i "s|image: ghcr.io/ajacobs06/portfolio:.*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          if git diff --quiet k8s/deployment.yaml; then
            echo "No changes to deployment.yaml. Already deployed.";
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Update deployment image to ${GITHUB_SHA::7}"
            # main may have moved on while the image built, so rebase onto it and retry
            for attempt in 1 2 3; do
              git push origin HEAD:main && exit 0
              echo "Push rejected (attempt ${attempt}), rebasing onto latest main"
              git pull --rebase origin main
            done
            echo "Could not push after 3 attempts" >&2
            exit 1
          fi
  
